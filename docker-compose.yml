services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcit_posts
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      # Creates a second "tcit_posts_test" database on first boot, so the
      # e2e suite has somewhere disposable to run against — see
      # backend/docker/init-test-db.sql.
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tcit_posts']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tcit_posts?schema=public
      CORS_ORIGIN: http://localhost:5173
      IDEMPOTENCY_KEY_TTL_HOURS: 24
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls this directly, so it has to be an address
        # reachable from the host, not the internal "backend" service name.
        VITE_API_BASE_URL: http://localhost:4000/api
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  db_data:
